<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Book Catalog</title>
  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.95); }
      100% { opacity: 1; transform: scale(1); }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 50%, #dee2e6 100%);
      color: #2C3E50;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      animation: fadeIn 1.5s ease-in-out;
      font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 30px;
      text-align: center;
      color: #2C3E50;
      text-shadow: 0 2px 8px rgba(44, 62, 80, 0.2);
      font-weight: 700;
      letter-spacing: -1px;
      animation: slideUp 1.2s ease-out;
    }

    #search-container {
      margin-bottom: 15px;
      display: flex;
      justify-content: flex-start;
      width: 100%;
      gap: 10px;
      animation: fadeIn 1.8s ease-in-out;
    }

    #search-input {
      padding: 12px 16px;
      font-size: 16px;
      border-radius: 12px;
      border: 2px solid rgba(44, 62, 80, 0.2);
      width: 350px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(44, 62, 80, 0.1);
      color: #2C3E50;
    }

    #search-input:focus {
      outline: none;
      border-color: #2C3E50;
      box-shadow: 0 0 0 3px rgba(44, 62, 80, 0.15), 0 4px 20px rgba(44, 62, 80, 0.2);
      transform: translateY(-1px);
      background: rgba(255, 255, 255, 0.95);
    }

    #search-input::placeholder {
      color: rgba(44, 62, 80, 0.6);
    }

    #refresh-button, #download-button {
      padding: 12px 14px;
      font-size: 20px;
      font-weight: 600;
      color: #FFFFFF;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(44, 62, 80, 0.3);
      backdrop-filter: blur(10px);
      /* background: linear-gradient(135deg, #2C3E50, #34495e); */
    }

    #refresh-button:hover,
    #download-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(44, 62, 80, 0.4);
      /* background: linear-gradient(135deg, #34495e, #2C3E50); */
    }

    #refresh-button:active,
    #download-button:active {
      transform: translateY(0px);
    }

    #download-button:disabled {
      background: linear-gradient(135deg, #95a5a6, #7f8c8d);
      cursor: not-allowed;
      opacity: 0.6;
    }

    .table-container {
      width: 100%;
      overflow-x: auto;
      max-height: 70vh;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(44, 62, 80, 0.15);
      animation: popIn 1s ease-in-out;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(44, 62, 80, 0.1);
    }

    table {
      border-collapse: collapse;
      width: 100%;
      user-select: text;
    }

    th, td {
      border: 1px solid rgba(44, 62, 80, 0.1);
      padding: 12px 16px;
      text-align: center;
      color: #2C3E50;
      font-size: 14px;
      transition: all 0.3s ease;
    }

    th {
      background: linear-gradient(135deg, #2C3E50, #34495e);
      color: #FFFFFF;
      position: sticky;
      top: 0;
      z-index: 1;
      font-size: 16px;
      font-weight: 600;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
      border-bottom: 2px solid rgba(255, 255, 255, 0.2);
    }

    tbody tr {
      transition: all 0.3s ease;
    }

    tbody tr:hover {
      background: rgba(44, 62, 80, 0.08);
      transform: translateY(-1px);
      box-shadow: 0 4px 15px rgba(44, 62, 80, 0.15);
    }

    tbody tr:nth-child(even) {
      background: rgba(248, 249, 250, 0.7);
    }

    #loading {
      font-size: 16px;
      margin-bottom: 15px;
      display: block;
      animation: fadeIn 1s ease-in-out;
      color: #2C3E50;
      background: rgba(255, 255, 255, 0.9);
      padding: 12px 20px;
      border-radius: 8px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(44, 62, 80, 0.1);
      box-shadow: 0 4px 15px rgba(44, 62, 80, 0.1);
    }

    body, table, th, td {
      user-select: text;
    }

    .back-btn {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(255, 255, 255, 0.9);
      color: #2C3E50;
      border: none;
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
      animation: slideUp 1s ease-in-out;
      padding: 10px 12px;
      border-radius: 12px;
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(44, 62, 80, 0.1);
      border: 1px solid rgba(44, 62, 80, 0.1);
    }

    .back-btn:hover {
      transform: scale(1.1) translateY(-2px);
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 6px 20px rgba(44, 62, 80, 0.2);
      color: #34495e;
    }

    #bottom-summary {
      width: 100%;
      margin-top: 15px;
      font-weight: 600;
      font-size: 16px;
      color: #2C3E50;
      padding: 0 20px;
      animation: fadeIn 1s ease-in-out;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .left-summary, .right-summary {
      background: rgba(255, 255, 255, 0.9);
      padding: 12px 20px;
      border-radius: 12px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(44, 62, 80, 0.1);
      box-shadow: 0 4px 15px rgba(44, 62, 80, 0.1);
      pointer-events: auto;
    }

    .status {
      margin-top: 15px;
      text-align: center;
      font-weight: 600;
      font-size: 14px;
      min-height: 20px;
      padding: 8px 16px;
      border-radius: 8px;
      backdrop-filter: blur(10px);
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(44, 62, 80, 0.1);
    }

    /* Dropdown */
    .dropdown {
      position: relative;
      display: inline-block;
    }

    .dropdown-content {
      display: none;
      position: absolute;
      top: 110%;
      right: 0;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(15px);
      min-width: 250px;
      border-radius: 12px;
      box-shadow: 0 15px 35px rgba(44, 62, 80, 0.2);
      z-index: 10;
      overflow: hidden;
      border: 1px solid rgba(44, 62, 80, 0.2);
      animation: fadeIn 0.3s ease-in-out;
    }

    .dropdown-content.show {
      display: block;
    }

    .dropdown-content button {
      background: none;
      color: #2C3E50;
      padding: 12px 16px;
      border: none;
      text-align: left;
      width: 100%;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s ease;
    }

    .dropdown-content button:hover {
      background: rgba(44, 62, 80, 0.1);
      color: #2C3E50;
      transform: translateX(5px);
    }

    /* Generic modal style for filters */
    .filter-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(44, 62, 80, 0.6);
      backdrop-filter: blur(8px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .filter-modal > div {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.95), rgba(248, 249, 250, 0.95));
      backdrop-filter: blur(20px);
      padding: 30px 40px;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(44, 62, 80, 0.3);
      min-width: 350px;
      text-align: center;
      animation: popIn 0.3s ease;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .filter-modal h3 {
      margin-bottom: 20px;
      color: #2C3E50;
      font-size: 20px;
      font-weight: 600;
    }

    .filter-modal input, .filter-modal select {
      padding: 12px 16px;
      margin: 15px 0;
      font-size: 14px;
      border: 2px solid rgba(44, 62, 80, 0.3);
      border-radius: 8px;
      width: 85%;
      background: rgba(255, 255, 255, 0.9);
      transition: all 0.3s ease;
      color: #2C3E50;
    }

    .filter-modal input:focus, .filter-modal select:focus {
      outline: none;
      border-color: #2C3E50;
      box-shadow: 0 0 0 3px rgba(44, 62, 80, 0.2);
    }

    .filter-modal button {
      padding: 12px 24px;
      margin: 15px 8px 0 8px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      color: white;
      min-width: 100px;
      transition: all 0.3s ease;
    }

    .filter-modal button:first-of-type {
      background: linear-gradient(135deg, #2C3E50, #34495e);
      box-shadow: 0 4px 15px rgba(44, 62, 80, 0.3);
    }

    .filter-modal button:first-of-type:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(44, 62, 80, 0.4);
      background: linear-gradient(135deg, #34495e, #2C3E50);
    }

    .filter-modal button:last-of-type {
      background: linear-gradient(135deg, #e74c3c, #c0392b);
      box-shadow: 0 4px 15px rgba(231, 76, 60, 0.3);
    }

    .filter-modal button:last-of-type:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(231, 76, 60, 0.4);
    }
  </style>
</head>
<body>
  <button class="back-btn" onclick="goBack()">←</button>
  <h1>Book Catalog</h1>
  <div id="loading">Loading book data...</div>
  <div id="status-msg" class="status"></div>
  
  <div id="search-container">
    <input type="text" id="search-input" placeholder="Search by any field..." oninput="filterBooks()" />
    <button id="refresh-button" onclick="fetchBooks()" title="Refresh">🔄️</button>
    <div class="dropdown">
      <button id="download-button" onclick="toggleDropdown()" title="Download">⬇️</button>
      <div id="loader" style="display:none;">⏳</div>
      <div id="dropdown-content" class="dropdown-content">
        <!-- Loader (can be styled as spinner or any animation) -->
        

        <button onclick="downloadAll()">Download All</button><hr>
        <button onclick="openFilterModal('name-modal')">By Book Name</button>
        <button onclick="openFilterModal('author-modal')">By Author</button>
        <button onclick="openFilterModal('year-modal')">By Published Year</button>
        <button onclick="openFilterModal('stock-modal')">By Stock Status</button>
      </div>
    </div>
  </div>

  <div class="table-container">
    <table id="book-table">
      <thead>
        <tr>
          <th>Book ID</th>
          <th>Name</th>
          <th>Author</th>
          <th>Published Year</th>
          <th>Edition</th>
          <th>Price</th>
          <th>Availability</th>
        </tr>
      </thead>
      <tbody id="book-tbody">
        <!-- Book data will be inserted here -->
      </tbody>
    </table>
  </div>

  <!-- Bottom Summary Panel -->
  <div id="bottom-summary">
    <div class="left-summary">
      📚 <strong>Total Books:</strong> <span id="total-books">0</span><br>
      🚫<strong>Total Missing Books:</strong> <span id="total-missing-books">0</span>
    </div>
    <div class="right-summary">
      ✔️ <strong>Available:</strong> <span id="in-stock">0</span> <br>
      ❌ <strong>Unavailable:</strong> <span id="out-of-stock">0</span>
    </div>
  </div>
  
  <!-- Filter Modals -->
  <div id="name-modal" class="filter-modal"><div>
    <h3>Filter by Book Name</h3>
    <input type="text" id="filter-name" placeholder="Enter Book Name">
    <button onclick="confirmFilterDownload('name')">Download</button>
    <button onclick="closeFilterModal('name-modal')">Cancel</button>
  </div></div>

  <div id="author-modal" class="filter-modal"><div>
    <h3>Filter by Author</h3>
    <input type="text" id="filter-author" placeholder="Enter Author Name">
    <button onclick="confirmFilterDownload('author')">Download</button>
    <button onclick="closeFilterModal('author-modal')">Cancel</button>
  </div></div>

  <div id="year-modal" class="filter-modal"><div>
    <h3>Filter by Published Year</h3>
    <input type="number" id="filter-year" placeholder="Enter Year">
    <button onclick="confirmFilterDownload('year')">Download</button>
    <button onclick="closeFilterModal('year-modal')">Cancel</button>
  </div></div>

  <div id="stock-modal" class="filter-modal"><div>
    <h3>Filter by Stock Status</h3>
    <select id="filter-stock">
      <option value="">-- Select Status --</option>
      <option value="In Stock">In Stock</option>
      <option value="Out of Stock">Out of Stock</option>
      <option value="Others">Others</option>
    </select>
    <button onclick="confirmFilterDownload('stock')">Download</button>
    <button onclick="closeFilterModal('stock-modal')">Cancel</button>
  </div></div>

  
  <script>
    function showMessage(message, color = "green") {
      const msgBox = document.getElementById("status-msg");
      msgBox.textContent = message;
      msgBox.style.color = color;
      setTimeout(() => {
    msgBox.textContent = "";
  }, 5000);
    }
    let allBooks = [];
    let firstLoadComplete = false;

    async function fetchBooks() {
      const loadingText = document.getElementById("loading");

      if (!firstLoadComplete) {
        loadingText.style.display = "block";
        loadingText.textContent = "Loading book data...";
      }

      const api = window.pywebview.api;
      const books = await api.fetch_books();
      await fetchSummary();  // ✅ Fetch totals here

      if (JSON.stringify(books) !== JSON.stringify(allBooks)) {
        allBooks = books;
        renderTable(books);
      }

      if (!firstLoadComplete) {
        loadingText.style.display = "none";
        firstLoadComplete = true;
        setInterval(fetchBooks, 10000);
      }
    }

    function renderTable(books) {
      const table = document.getElementById("book-table");
      while (table.rows.length > 1) {
        table.deleteRow(1);
      }

      books.forEach((book, i) => {
        const row = table.insertRow();
        row.style.animationDelay = `${i * 0.05}s`;
        row.innerHTML = `
          <td>${book.Book_ID}</td>
          <td>${book.Book_Name}</td>
          <td>${book.Author}</td>
          <td>${book.Published_Year}</td>
          <td>${book.Edition}</td>
          <td>${book.Book_Price}</td>
          <td>
            ${book.Stock_Status === "In Stock"
              ? "✔️"
              : book.Stock_Status === "Out of Stock"
              ? "❌"
              : "🚫"}
          </td>
        `;
      });
    }

    async function fetchSummary() {
  try {
    const stats = await window.pywebview.api.total_books();
    document.getElementById("total-books").textContent = stats.total;
    document.getElementById("in-stock").textContent = stats.in_stock;
    document.getElementById("out-of-stock").textContent = stats.out_of_stock;
    document.getElementById("total-missing-books").textContent = stats.missingbook;
  } catch (error) {
    console.error("Summary fetch failed:", error);
    document.getElementById("total-books").textContent = "❌";
    document.getElementById("in-stock").textContent = "❌";
    document.getElementById("out-of-stock").textContent = "❌";
    document.getElementById("total-missing-books").textContent = "❌";
  }
}


    document.getElementById("search-input").addEventListener("input", () => {
      const searchValue = document.getElementById("search-input").value.toLowerCase();
      const filteredBooks = allBooks.filter(book =>
        Object.values(book).some(value =>
          String(value).toLowerCase().includes(searchValue)
        )
      );
      renderTable(filteredBooks);
    });

    function goBack() {
      if (window.pywebview && window.pywebview.api) {
        window.pywebview.api.go_back();
      } else {
        console.error("PyWebView API is unavailable.");
        showMessage("❌ Internal error: Unable to go back.","red");
      }
    }

  // Dropdown toggle
document.getElementById("download-button").addEventListener("click", e => {
  e.stopPropagation();
  document.querySelector(".dropdown-content").classList.toggle("show");
});
window.addEventListener("click", () => {
  const d = document.querySelector(".dropdown-content");
  if (d.classList.contains("show")) d.classList.remove("show");
});

// Modal open/close
function openFilterModal(id) {
  document.getElementById(id).style.display = "flex";
}
function closeFilterModal(id) {
  document.getElementById(id).style.display = "none";
}
async function downloadAll() {
  const downloadBtn = document.getElementById("download-button");
  const originalIcon = downloadBtn.innerHTML;

  downloadBtn.innerHTML = "⏳";      // Replace icon with loader
  downloadBtn.disabled = true;      // Disable button

  try {
    await window.pywebview.api.download();
    showMessage("✅ Downloading all books...", "green");
  } catch (error) {
    showMessage("⚠️ Download failed.", "red");
  } finally {
    downloadBtn.innerHTML = originalIcon;  // Restore original icon
    downloadBtn.disabled = false;          // Re-enable button
  }
}




// FILTERED DOWNLOAD with ⏳ loader
async function confirmFilterDownload(filterKey) {
  const keyToFieldMap = {
    'name': 'Book_Name',
    'author': 'Author',
    'year': 'Published_Year',
    'stock': 'Stock_Status'
  };

  const idMap = {
    'name': 'filter-name',
    'author': 'filter-author',
    'year': 'filter-year',
    'stock': 'filter-stock'
  };

  const filterType = keyToFieldMap[filterKey];
  const inputId = idMap[filterKey];
  const filterValue = document.getElementById(inputId).value.trim();

  const btn = event.target;
  const originalText = btn.innerHTML;

  const allButtons = document.querySelectorAll(".filter-download-btn");
  allButtons.forEach(button => {
    button.disabled = true;
    if (button !== btn) button.classList.add("disabled-btn");
  });

  btn.innerHTML = "⏳";

  if (!filterValue) {
    showMessage("⚠️ Please enter/select a filter value!", "orange");
    btn.innerHTML = originalText;
    allButtons.forEach(button => {
      button.disabled = false;
      button.classList.remove("disabled-btn");
    });
    return;
  }

  const args = {
    Book_Name: null,
    Author: null,
    Published_Year: null,
    Stock_Status: null
  };

  args[filterType] = filterValue;

  try {
    const res = await window.pywebview.api.download(
      args.Book_Name,
      args.Author,
      args.Published_Year,
      args.Stock_Status
    );

    if (res === true) {
      showMessage(`✅ Downloaded books filtered by ${filterType}`, "green");
    } else {
      showMessage("❌ Download failed", "red");
    }

    closeFilterModal(`${filterKey}-modal`);
    document.getElementById(inputId).value = '';
  } catch (err) {
    console.error(err);
    showMessage("⚠️ Filtered download failed.", "red");
  } finally {
    allButtons.forEach(button => {
      button.disabled = false;
      button.classList.remove("disabled-btn");
    });
    btn.innerHTML = originalText;
  }
}



   
    setInterval(fetchBooks, 1000);
  </script>
</body>
</html>
