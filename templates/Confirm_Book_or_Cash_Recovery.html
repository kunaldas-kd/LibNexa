<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📚 Confirm Book/Cash Recovery</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #f1f5f9;
            --accent: #06b6d4;
            --success: #10b981;
            --error: #ef4444;
            --warning: #f59e0b;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --surface: rgba(255, 255, 255, 0.9);
            --border: rgba(148, 163, 184, 0.2);
            --shadow: rgba(0, 0, 0, 0.1);
            --shadow-lg: rgba(0, 0, 0, 0.2);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #2C3E50 0%, #34495E 35%, #3498DB 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
            padding: 20px 0;
        }

        /* Animated background elements */
        .bg-decoration {
            position: fixed;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }

        .bg-decoration::before,
        .bg-decoration::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            animation: float 8s ease-in-out infinite;
        }

        .bg-decoration::before {
            width: 400px;
            height: 400px;
            top: -200px;
            right: -200px;
            animation-delay: -3s;
        }

        .bg-decoration::after {
            width: 300px;
            height: 300px;
            bottom: -150px;
            left: -150px;
            animation-delay: -6s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-30px) rotate(180deg); }
        }

        .back-btn {
            position: fixed;
            top: 24px;
            left: 24px;
            background: var(--surface);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 12px;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 20px;
            color: var(--text-primary);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 100;
            box-shadow: 0 4px 6px -1px var(--shadow);
        }

        .back-btn:hover {
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 10px 25px -3px var(--shadow-lg);
            background: rgba(255, 255, 255, 1);
        }

        .form-container {
            background: var(--surface);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            padding: 48px 40px;
            border-radius: 24px;
            width: 100%;
            max-width: 700px;
            box-shadow: 0 25px 50px -12px var(--shadow-lg);
            position: relative;
            z-index: 1;
            animation: slideUp 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .header-section {
            text-align: center;
            margin-bottom: 40px;
        }

        .header-title {
            font-size: 32px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
            line-height: 1.2;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 16px;
            font-weight: 400;
        }

        .status {
            margin-bottom: 24px;
            text-align: center;
            font-weight: 500;
            font-size: 14px;
            min-height: 20px;
            padding: 12px;
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        .status.success {
            background: rgba(16, 185, 129, 0.1);
            color: #059669;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .status.error {
            background: rgba(239, 68, 68, 0.1);
            color: #dc2626;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .status.warning {
            background: rgba(245, 158, 11, 0.1);
            color: #d97706;
            border: 1px solid rgba(245, 158, 11, 0.2);
        }

        .status:empty {
            display: none;
        }

        .form-grid {
            display: grid;
            gap: 24px;
            margin-bottom: 32px;
        }

        .form-group {
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
            margin-left: 4px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 18px;
            z-index: 2;
        }

        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            padding: 16px 16px 16px 52px;
            border: 2px solid var(--border);
            border-radius: 12px;
            font-size: 16px;
            font-weight: 400;
            background: rgba(255, 255, 255, 0.8);
            color: var(--text-primary);
            outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
        }

        select {
            cursor: pointer;
        }

        input:focus,
        select:focus {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 1);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
            transform: translateY(-1px);
        }

        input::placeholder {
            color: var(--text-secondary);
            font-weight: 400;
        }

        input[readonly] {
            background: rgba(241, 245, 249, 0.8);
            cursor: not-allowed;
        }

        input[readonly]:focus {
            border-color: var(--border);
            box-shadow: none;
            transform: none;
        }

        .hidden {
            display: none;
        }

        .recovery-section {
            margin-bottom: 24px;
            padding: 24px;
            background: rgba(99, 102, 241, 0.05);
            border: 1px solid rgba(99, 102, 241, 0.1);
            border-radius: 16px;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .recovery-section h3 {
            color: var(--primary);
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .button-group {
            display: flex;
            margin-top: 32px;
        }

        .submit-btn {
            flex: 1;
            padding: 18px;
            border-radius: 12px;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: linear-gradient(135deg, #0ca701, #087700);
            color: white;
            box-shadow: 0 4px 14px 0 rgba(12, 167, 1, 0.4);
        }

        .submit-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px 0 rgba(12, 167, 1, 0.5);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
            box-shadow: 0 4px 14px 0 rgba(12, 167, 1, 0.2);
        }

        .submit-btn::before{
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .submit-btn:hover:not(:disabled)::before {
            left: 100%;
        }

        @media (max-width: 768px) {
            .form-container {
                margin: 10px;
                padding: 32px 24px;
                max-width: none;
            }

            .header-title {
                font-size: 24px;
            }

            .back-btn {
                top: 16px;
                left: 16px;
            }

            input[type="text"],
            input[type="number"],
            select {
                padding: 14px 14px 14px 48px;
                font-size: 16px;
            }

            .input-icon {
                left: 14px;
                font-size: 16px;
            }

            .recovery-section {
                padding: 16px;
            }
        }

        @media (max-width: 480px) {
            .form-container {
                margin: 5px;
                padding: 24px 16px;
            }

            .form-grid {
                gap: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-decoration"></div>
    
    <button class="back-btn" onclick="goBack()" aria-label="Go back">
        ←
    </button>

    <div class="form-container">
        <div class="header-section">
            <h1 class="header-title">📚 Confirm Recovery</h1>
            <p class="subtitle">Select recovery type and confirm book or cash recovery</p>
        </div>

        <div id="status-msg" class="status"></div>

        <div class="form-grid">
            <div class="form-group">
                <label for="recoveryType">Recovery Type</label>
                <div class="input-wrapper">
                    <div class="input-icon">⚙️</div>
                    <select id="recoveryType" onchange="toggleForms()">
                        <option value="">-- Choose Recovery Type --</option>
                        <option value="book">Book Recovery</option>
                        <option value="cash">Cash Recovery</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Book Recovery Fields -->
        <div id="bookRecoveryFields" class="recovery-section hidden">
            <h3>📖 Book Recovery Details</h3>
            <div class="form-grid">
                <div class="form-group">
                    <label for="bookID">Book ID</label>
                    <div class="input-wrapper">
                        <div class="input-icon">🔍</div>
                        <input type="text" id="bookID" placeholder="Enter Book ID" />
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="BookName">Book Name</label>
                    <div class="input-wrapper">
                        <div class="input-icon">📚</div>
                        <input type="text" id="BookName" placeholder="Auto-filled Book Name" readonly />
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="Author">Author</label>
                    <div class="input-wrapper">
                        <div class="input-icon">✍️</div>
                        <input type="text" id="Author" placeholder="Auto-filled Author" readonly />
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="PublishedYear">Published Year</label>
                    <div class="input-wrapper">
                        <div class="input-icon">📅</div>
                        <input type="text" id="PublishedYear" placeholder="Enter Published Year"/>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="Edition">Edition</label>
                    <div class="input-wrapper">
                        <div class="input-icon">📄</div>
                        <input type="text" id="Edition" placeholder="Enter Edition" />
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="BookPrice">Book Price</label>
                    <div class="input-wrapper">
                        <div class="input-icon">💰</div>
                        <input type="text" id="BookPrice" placeholder="Enter Book Price" />
                    </div>
                </div>
            </div>
        </div>

        <!-- Cash Recovery Fields -->
        <div id="cashRecoveryFields" class="recovery-section hidden">
            <h3>💵 Cash Recovery Details</h3>
            <div class="form-grid">
                <div class="form-group">
                    <label for="studentID">Student ID</label>
                    <div class="input-wrapper">
                        <div class="input-icon">🎓</div>
                        <input type="text" id="studentID" placeholder="Enter Student ID" />
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="cashBookID">Book ID</label>
                    <div class="input-wrapper">
                        <div class="input-icon">📖</div>
                        <input type="text" id="cashBookID" placeholder="Enter Book ID" />
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="fetchedAmount">Amount</label>
                    <div class="input-wrapper">
                        <div class="input-icon">💰</div>
                        <input type="number" id="fetchedAmount" placeholder="Auto-Fetched Amount" />
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="paymentType">Payment Type</label>
                    <div class="input-wrapper">
                        <div class="input-icon">💳</div>
                        <select id="paymentType">
                            <option value="">-- Select Payment Type --</option>
                            <option value="Online">Online</option>
                            <option value="Cash">Cash</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="cashReason">Recovery Reason</label>
                    <div class="input-wrapper">
                        <div class="input-icon">📋</div>
                        <select id="cashReason">
                            <option value="">-- Select Recovery Reason --</option>
                            <option value="Lost">Lost</option>
                            <option value="Damaged">Damaged</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <div class="button-group">
            <button class="submit-btn" onclick="submitRecovery()">
                <span class="btn-text">✅ Confirm Recovery</span>
            </button>
        </div>
    </div>

<script>
    function showMessage(message, color = "green") {
        const msgBox = document.getElementById("status-msg");
        msgBox.textContent = message;
        msgBox.style.color = color;
        setTimeout(() => {
            msgBox.textContent = "";
        }, 5000);
    }

    function toggleForms() {
        const type = document.getElementById('recoveryType').value;
        document.getElementById('bookRecoveryFields').classList.add('hidden');
        document.getElementById('cashRecoveryFields').classList.add('hidden');

        if (type === 'book') {
            document.getElementById('bookRecoveryFields').classList.remove('hidden');
        } else if (type === 'cash') {
            document.getElementById('cashRecoveryFields').classList.remove('hidden');
        }
    }

    async function submitRecovery() {
        const type = document.getElementById('recoveryType').value;

        if (type === 'book') {
            const bookID = document.getElementById('bookID').value.trim();
            const publishedYear = document.getElementById('PublishedYear').value.trim();
            const edition = document.getElementById('Edition').value.trim();
            const bookPrice = document.getElementById('BookPrice').value.trim();

            if (!bookID || !publishedYear || !edition || !bookPrice) {
                showMessage("⚠ Please fill in all book details (ID, Edition, Price).","orange");
                return;
            }

            try {
                const res = await window.pywebview.api.confirm_book_recovery(bookID, publishedYear, edition, bookPrice);
                showMessage(res.message || "✅ Book recovery confirmed.","green");
                clearBookFields();
            } catch (err) {
                showMessage("❌ Error confirming book recovery.","red");
            }

        } else if (type === 'cash') {
            const studentID = document.getElementById('studentID').value.trim();
            const bookID = document.getElementById('cashBookID').value.trim();
            const newamount = document.getElementById('fetchedAmount').value.trim();
            const paymentType = document.getElementById('paymentType').value.trim();
            const reason = document.getElementById('cashReason').value.trim();

            if (!studentID || !bookID || !paymentType || !reason) {
                showMessage("⚠ Please fill in all required fields.","orange");
                return;
            }

            try {
                const res = await window.pywebview.api.confirm_cash_recovery(studentID, bookID, newamount, paymentType, reason);
                showMessage(res.message || "✅ Cash recovery confirmed.","green");
                clearcashFields();
            } catch (err) {
                showMessage("❌ Error confirming cash recovery.","red");
            }
        } else {
            showMessage("⚠ Please select a recovery type.","orange");
        }
    }

    function goBack() {
        if (window.pywebview?.api?.go_back) {
            window.pywebview.api.go_back();
        } else {
            showMessage("❌ Unable to go back.","red");
        }
    }

    document.addEventListener("DOMContentLoaded", () => {
        const bookInput = document.getElementById("bookID");
        const cashBookInput = document.getElementById("cashBookID");

        if (bookInput) {
            bookInput.addEventListener("input", debounce(fetchBookDetails, 1000));
        }

        if (cashBookInput) {
            cashBookInput.addEventListener("input", debounce(fetchAmount, 1000));
        }
    });

    async function fetchBookDetails() {
        const bookID = document.getElementById("bookID").value.trim();

        if (!bookID) {
            clearBookFields();
            return;
        }

        try {
            const response = await window.pywebview.api.get_book_details(bookID);
            if (response.status === "success") {
                document.getElementById("BookName").value = response.bookname || "";
                document.getElementById("Author").value = response.author || "";
                document.getElementById("PublishedYear").value = response.Published_Year || "";
                document.getElementById("Edition").value = response.Edition || "";
                document.getElementById("BookPrice").value = response.Price || "";
            } else {
                clearBookFields();
                showMessage("❌ No data found for this Book ID.","red");
            }
        } catch (error) {
            clearBookFields();
            showMessage("❌ Failed to fetch book details.","red");
        }
    }

    function clearBookFields() {
        document.getElementById("bookID").value = "";
        document.getElementById("BookName").value = "";
        document.getElementById("Author").value = "";
        document.getElementById("PublishedYear").value = "";
        document.getElementById("Edition").value = "";
        document.getElementById("BookPrice").value = "";
    }

    function clearcashFields() {
        document.getElementById('studentID').value= "";
        document.getElementById('cashBookID').value= "";
        document.getElementById('fetchedAmount').value= "";
        document.getElementById('paymentType').value= "";
        document.getElementById('cashReason').value= "";
    }

    async function fetchAmount() {
        const bookID = document.getElementById("cashBookID").value.trim();

        if (!bookID) {
            document.getElementById("fetchedAmount").value = "";
            return;
        }

        try {
            const response = await window.pywebview.api.get_amount(bookID);
            if (response.status === "success") {
                document.getElementById("fetchedAmount").value = response.amount;
            } else {
                document.getElementById("fetchedAmount").value = "";
                showMessage("❌ No amount found for this Book ID.","red");
            }
        } catch (error) {
            console.error("Error fetching amount:", error);
            showMessage("❌ Failed to fetch the amount.","red");
        }
    }

    function debounce(func, delay) {
        let timeoutId;
        return function (...args) {
            clearTimeout(timeoutId);
            timeoutId = setTimeout(() => func.apply(this, args), delay);
        };
    }
</script>

</body>
</html>
