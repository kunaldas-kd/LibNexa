<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Financial Ledger</title>
  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.95); }
      100% { opacity: 1; transform: scale(1); }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 50%, #dee2e6 100%);
      color: #2C3E50;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      animation: fadeIn 1.5s ease-in-out;
      font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: text;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 30px;
      text-align: center;
      color: #2C3E50;
      text-shadow: 0 2px 8px rgba(44, 62, 80, 0.2);
      font-weight: 700;
      letter-spacing: -1px;
      animation: slideUp 1.2s ease-out;
      background: linear-gradient(45deg, #2C3E50, #34495e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    #search-container {
      margin-bottom: 15px;
      display: flex;
      justify-content: flex-start;
      width: 100%;
      gap: 10px;
      animation: fadeIn 1.8s ease-in-out;
    }

    #search-container1 {
      display: flex;
      justify-content: flex-end;
      width: 100%;
      gap: 10px;
      animation: fadeIn 2s ease-in-out;
    }

    #search-input {
      padding: 12px 16px;
      font-size: 16px;
      border-radius: 12px;
      border: 2px solid rgba(44, 62, 80, 0.2);
      width: 350px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(44, 62, 80, 0.1);
      color: #2C3E50;
    }

    #search-input:focus {
      outline: none;
      border-color: #2C3E50;
      box-shadow: 0 0 0 3px rgba(44, 62, 80, 0.15), 0 4px 20px rgba(44, 62, 80, 0.2);
      transform: translateY(-1px);
      background: rgba(255, 255, 255, 0.95);
    }

    #search-input::placeholder {
      color: rgba(44, 62, 80, 0.6);
    }

    #dashboard-btn,
    #refresh-button,
    #download-button,
    #calendar-btn {
      padding: 12px 20px;
      font-size: 16px;
      font-weight: 600;
      color: #FFFFFF;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(44, 62, 80, 0.3);
      backdrop-filter: blur(10px);
    }

    #dashboard-btn { 
      background: linear-gradient(135deg, #e74c3c, #c0392b);
    }

   
    #dashboard-btn:hover,
    #refresh-button:hover,
    #download-button:hover,
    #calendar-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(44, 62, 80, 0.4);
    }

    #dashboard-btn:active,
    #refresh-button:active,
    #download-button:active,
    #calendar-btn:active {
      transform: translateY(0px);
    }

    #download-button:disabled {
      background: linear-gradient(135deg, #95a5a6, #7f8c8d);
      cursor: not-allowed;
      opacity: 0.6;
    }

    .table-container {
      width: 100%;
      overflow-x: auto;
      max-height: 70vh;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(44, 62, 80, 0.15);
      animation: popIn 1s ease-in-out;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(44, 62, 80, 0.1);
    }

    table {
      border-collapse: collapse;
      width: 100%;
      user-select: text;
    }

    th, td {
      border: 1px solid rgba(44, 62, 80, 0.1);
      padding: 12px 16px;
      text-align: center;
      color: #2C3E50;
      font-size: 14px;
      transition: all 0.3s ease;
      user-select: text;
    }

    th {
      background: linear-gradient(135deg, #2C3E50, #34495e);
      color: #FFFFFF;
      position: sticky;
      top: 0;
      z-index: 1;
      font-size: 16px;
      font-weight: 600;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
      border-bottom: 2px solid rgba(255, 255, 255, 0.2);
    }

    tbody tr {
      transition: all 0.3s ease;
    }

    tbody tr:hover {
      background: rgba(44, 62, 80, 0.08);
      transform: translateY(-1px);
      box-shadow: 0 4px 15px rgba(44, 62, 80, 0.15);
    }

    tbody tr:nth-child(even) {
      background: rgba(248, 249, 250, 0.7);
    }

    #loading {
      font-size: 16px;
      margin-bottom: 15px;
      display: block;
      animation: fadeIn 1s ease-in-out;
      color: #2C3E50;
      background: rgba(255, 255, 255, 0.9);
      padding: 12px 20px;
      border-radius: 8px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(44, 62, 80, 0.1);
      box-shadow: 0 4px 15px rgba(44, 62, 80, 0.1);
    }

    .back-btn {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(255, 255, 255, 0.9);
      color: #2C3E50;
      border: none;
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
      animation: slideUp 1s ease-in-out;
      padding: 10px 12px;
      border-radius: 12px;
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(44, 62, 80, 0.1);
      border: 1px solid rgba(44, 62, 80, 0.1);
    }

    .back-btn:hover {
      transform: scale(1.1) translateY(-2px);
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 6px 20px rgba(44, 62, 80, 0.2);
      color: #34495e;
    }

    .status {
      margin-top: 15px;
      text-align: center;
      font-weight: 600;
      font-size: 14px;
      min-height: 20px;
      /* padding: 8px 16px; */
      border-radius: 8px;
      backdrop-filter: blur(10px);
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(44, 62, 80, 0.1);
    }

    /* Dropdown styling */
    .dropdown {
      position: relative;
      display: inline-block;
    }

    .dropdown-content {
      display: none;
      position: absolute;
      top: 110%;
      right: 0;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(15px);
      min-width: 250px;
      border-radius: 12px;
      box-shadow: 0 15px 35px rgba(44, 62, 80, 0.2);
      z-index: 10;
      overflow: hidden;
      border: 1px solid rgba(44, 62, 80, 0.2);
      animation: fadeIn 0.3s ease-in-out;
    }

    .dropdown-content button {
      background: none;
      color: #2C3E50;
      padding: 12px 16px;
      border: none;
      text-align: left;
      width: 100%;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s ease;
    }

    .dropdown-content button:hover {
      background: rgba(44, 62, 80, 0.1);
      color: #2C3E50;
      transform: translateX(5px);
    }

    .dropdown-content.show {
      display: block;
    }

    /* Modal styling */
    .filter-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(50, 80, 44, 0.6);
      backdrop-filter: blur(8px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .filter-modal > div {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.95), rgba(248, 249, 250, 0.95));
      backdrop-filter: blur(20px);
      padding: 30px 40px;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(44, 62, 80, 0.3);
      min-width: 350px;
      text-align: center;
      animation: popIn 0.3s ease;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .filter-modal h3 {
      margin-bottom: 20px;
      color: #2C3E50;
      font-size: 20px;
      font-weight: 600;
    }

    .filter-modal input, .filter-modal select {
      padding: 12px 16px;
      margin: 15px 0;
      font-size: 14px;
      border: 2px solid rgba(44, 62, 80, 0.3);
      border-radius: 8px;
      width: 85%;
      background: rgba(255, 255, 255, 0.9);
      transition: all 0.3s ease;
      color: #2C3E50;
    }

    .filter-modal input:focus, .filter-modal select:focus {
      outline: none;
      border-color: #2C3E50;
      box-shadow: 0 0 0 3px rgba(44, 62, 80, 0.2);
    }

    .filter-modal button {
      padding: 12px 24px;
      margin: 15px 8px 0 8px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      color: white;
      min-width: 100px;
      transition: all 0.3s ease;
    }

    .filter-modal button:first-of-type {
      background: linear-gradient(135deg, #098b14, #0bb63f);
      box-shadow: 0 4px 15px rgba(44, 62, 80, 0.3);
    }

    .filter-modal button:first-of-type:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(44, 62, 80, 0.4);
    }

    .filter-modal button:last-of-type {
      background: linear-gradient(135deg, #e74c3c, #c0392b);
      box-shadow: 0 4px 15px rgba(231, 76, 60, 0.3);
    }

    .filter-modal button:last-of-type:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(231, 76, 60, 0.4);
    }

    /* Date Range Modal Styles */
    #date-modal, #date-modal1 {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(44, 62, 80, 0.6);
      backdrop-filter: blur(8px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 10000;
    }

    #date-modal > div, #date-modal1 > div {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.95), rgba(248, 249, 250, 0.95));
      backdrop-filter: blur(20px);
      padding: 30px 40px;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(44, 62, 80, 0.3);
      min-width: 350px;
      text-align: center;
      animation: popIn 0.3s ease;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    #date-modal h3, #date-modal1 h3 {
      margin-bottom: 20px;
      color: #2C3E50;
      font-size: 20px;
      font-weight: 600;
    }

    #date-modal label, #date-modal1 label {
      font-weight: 600;
      color: #2C3E50;
      display: block;
      margin: 15px 0 8px 0;
      font-size: 14px;
      text-align: left;
    }

    #date-modal input[type="date"], #date-modal1 input[type="date"] {
      padding: 12px 16px;
      font-size: 14px;
      border: 2px solid rgba(44, 62, 80, 0.3);
      border-radius: 8px;
      width: 100%;
      background: rgba(255, 255, 255, 0.9);
      transition: all 0.3s ease;
      color: #2C3E50;
    }

    #date-modal input[type="date"]:focus, #date-modal1 input[type="date"]:focus {
      outline: none;
      border-color: #2C3E50;
      box-shadow: 0 0 0 3px rgba(44, 62, 80, 0.2);
    }

    #date-modal button, #date-modal1 button {
      padding: 12px 24px;
      margin: 20px 8px 0 8px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      color: white;
      min-width: 100px;
      transition: all 0.3s ease;
    }

    #date-modal button:first-of-type, #date-modal1 button:first-of-type {
      background: linear-gradient(135deg, #098b14, #0bb63f);
      box-shadow: 0 4px 15px rgba(44, 62, 80, 0.3);
    }

    #date-modal button:first-of-type:hover, #date-modal1 button:first-of-type:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(44, 62, 80, 0.4);
    }

    #date-modal button:last-of-type, #date-modal1 button:last-of-type {
      background: linear-gradient(135deg, #e74c3c, #c0392b);
      box-shadow: 0 4px 15px rgba(231, 76, 60, 0.3);
    }

    #date-modal button:last-of-type:hover, #date-modal1 button:last-of-type:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(231, 76, 60, 0.4);
    }

    /* Credit/Debit specific styles */
    .credit-amount {
      color: #27ae60;
      font-weight: 600;
    }

    .debit-amount {
      color: #e74c3c;
      font-weight: 600;
    }

    .balance-positive {
      color: #27ae60;
      font-weight: 600;
    }

    .balance-negative {
      color: #e74c3c;
      font-weight: 600;
    }

    /* Total Balance Display */
    #total-balance {
      width: 100%;
      text-align: right;
      margin-top: 15px;
      font-weight: 600;
      font-size: 18px;
      color: #2C3E50;
      padding: 12px 20px;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 12px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(44, 62, 80, 0.1);
      animation: fadeIn 1s ease-in-out;
      box-shadow: 0 4px 15px rgba(44, 62, 80, 0.1);
    }

    #CurrentBalance {
      width: 100%;
      text-align: right;
      margin-top: 15px;
      font-weight:bolder;
      font-size: 18px;
      color: #c90000;
      padding: 12px 20px;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 12px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(44, 62, 80, 0.1);
      animation: fadeIn 1s ease-in-out;
      box-shadow: 0 4px 15px rgba(44, 62, 80, 0.1);
    }
  </style>
</head>
<body>
  <button class="back-btn" onclick="goBack()">←</button>
  <h1>Financial Ledger</h1>
  <div id="loading">Loading Cash Book...</div>
  <div id="status-msg" class="status"></div>
  
  <div id="search-container">
    <input type="text" id="search-input" placeholder="Search transactions..." />
    <button id="calendar-btn" onclick="openDateModal1()" title="Filter by Date Range">📅</button>
    <button id="refresh-button" onclick="fetchCashbook()" title="Refresh">🔄️</button>
    
    <!-- Download Dropdown -->
    <div class="dropdown">
      <button id="download-button" title="Download" onclick="toggleDropdown()">⬇️</button>
      <div class="dropdown-content">
        <button onclick="downloadAll()">Download All Records</button>
        <hr>
        <button onclick="openDateRangeModal()">Download by Date Range</button>
      </div>
    </div>
    
    <div id="search-container1">
      <button id="dashboard-btn" onclick="debit()">💸 Cash Withdrawal</button>
    </div>
  </div>

  <div class="table-container">
    <table id="cashbook-table">
      <thead>
        <tr>
          <th>Sl No.</th>
          <th>Transaction ID</th>
          <th>Particulars</th>
          <th>Transaction Date</th>
          <th>Description</th>
          <th>Transaction Type</th>
          <th>Amount</th>
          <th>Credit</th>
          <th>Debit</th>
          <th>End Balance</th>
        </tr>
      </thead>
      <tbody>
        
      </tbody>
    </table>
  </div>

  <div id="CurrentBalance">💰 Current Balance: 0</div>
  

  <!-- Date Range Modal for Download -->
  <div id="date-modal" class="filter-modal">
    <div>
      <h3>📅 Select Date Range for Download</h3>
      <label for="start-date">From Date:</label>
      <input type="date" id="start-date">
      
      <label for="end-date">To Date:</label>
      <input type="date" id="end-date">
      
      <button onclick="confirmDateDownload()">Download</button>
      <button onclick="closeDateModal()">Cancel</button>
    </div>
  </div>

  <!-- Date Range Modal for Filtering -->
  <div id="date-modal1" class="filter-modal">
    <div>
      <h3>📅 Filter by Date Range</h3>
      <label for="start-date1">From Date:</label>
      <input type="date" id="start-date1">
      
      <label for="end-date1">To Date:</label>
      <input type="date" id="end-date1">
      
      <button onclick="applyDateFilter()">Apply Filter</button>
      <button onclick="closeDateModal1()">Cancel</button>
    </div>
  </div>
  <script>
    function showMessage(message, color = "green") {
      const msgBox = document.getElementById("status-msg");
      msgBox.textContent = message;
      msgBox.style.color = color;
      setTimeout(() => {
    msgBox.textContent = "";
  }, 5000);
    }
    let allCashbookData = [];
    let firstLoadComplete = false;

    async function fetchCashbook() {
      const loadingText = document.getElementById("loading");

      if (!firstLoadComplete) {
        loadingText.style.display = "block";
        loadingText.textContent = "Loading Cash Book...";
      }

      if (!window.pywebview?.api) return;

      try {
        const Cashbook = await window.pywebview.api.fetch_Cashbook();

        if (JSON.stringify(Cashbook) !== JSON.stringify(allCashbookData)) {
          allCashbookData = Cashbook;
          renderCashbookTable(Cashbook);
          await updateTotalStudents();
        }

        if (!firstLoadComplete) {
          loadingText.style.display = "none";
          firstLoadComplete = true;
          setInterval(fetchCashbook, 10000);
        }
      } catch (error) {
        console.error("Error fetching data:", error);
        loadingText.textContent = "❌ Failed to load data.";
      }
    }

    function renderCashbookTable(data) {
      const table = document.getElementById("cashbook-table").querySelector("tbody");
      table.innerHTML = "";

      data.forEach((entry, i) => {
        const row = table.insertRow();
        row.style.animationDelay = `${i * 0.05}s`;
        row.innerHTML = `
          <td>${entry.Sl_No}</td>
          <td>${entry.Transaction_ID}</td>
          <td>${entry.Student_ID}</td>
          <td>${entry.Transaction_Date}</td>
          <td>${entry.Description}</td>
          <td>${entry.Transaction_Type}</td>
          <td>${entry.Amount}</td>
          <td>${entry.Credit=== "1" ? "✔️" : ""}</td>
          <td>${entry.Debit=== "1" ? "✔️" : ""}</td>
          <td>${entry.Balance}</td>
          
        `;
      });
      if (data.length > 0) {
          document.getElementById("CurrentBalance").textContent = `💰 Current Balance: ${data[data.length - 1].Balance}`;
        } else {
          document.getElementById("CurrentBalance").textContent = "💰 Current Balance: 0";
        }
      }
    
    // async function updateTotalStudents() {
    //   try {
    //     // const count = await window.pywebview.api.total_student();
    //     document.getElementById("total-students").textContent = `💰 Current Balance: ${entry.Balance}`;
    //   } catch (error) {
    //     console.error("Error fetching total student count:", error);
    //     document.getElementById("total-students").textContent = "💰 Current Balance: ❌";
    //   }
    // }
    document.getElementById("search-input").addEventListener("input", () => {
      const searchValue = document.getElementById("search-input").value.toLowerCase();
      const filtered = allCashbookData.filter(entry =>
        Object.values(entry).some(val =>
          String(val).toLowerCase().includes(searchValue)
        )
      );
      renderCashbookTable(filtered);
    });

    function goBack() {
      if (window.pywebview && window.pywebview.api) {
        window.pywebview.api.go_back();
      } else {
        console.error("PyWebView API is unavailable.");
        showMessage("❌ Internal error: Unable to go back.","red");
      }
    }

    /* -------------------- DROPDOWN TOGGLE -------------------- */
    document.getElementById("download-button").addEventListener("click", function(e) {
      e.stopPropagation();
      document.querySelector(".dropdown-content").classList.toggle("show");
    });

    window.addEventListener("click", function() {
      const dropdown = document.querySelector(".dropdown-content");
      if (dropdown.classList.contains("show")) dropdown.classList.remove("show");
    });

    /* -------------------- MODAL FUNCTIONS -------------------- */
    function openDateRangeModal() {
      document.getElementById("date-modal").style.display = "flex";
    }

    function closeDateModal() {
      document.getElementById("date-modal").style.display = "none";
      clearDateFields();
    }

    function clearDateFields() {
      document.getElementById("start-date").value = "";
      document.getElementById("end-date").value = "";
    }

    /* -------------------- DOWNLOAD FUNCTIONS -------------------- */
    async function confirmDateDownload() {
      const startDate = document.getElementById("start-date").value;
      const endDate = document.getElementById("end-date").value;

      if (!startDate || !endDate) {
        showMessage("⚠️ Please select both dates.", "orange");
        return;
      }

      const success = await triggerDownload(startDate, endDate);
      if (success) {
        clearDateFields();
        closeDateModal();
      }
    }

    async function downloadAll() {
      await triggerDownload();
    }

    async function triggerDownload(startDate = null, endDate = null) {
      const btn = document.getElementById("download-button");
      btn.disabled = true;
      const originalText = btn.textContent;
      btn.textContent = "⌛";

      try {
        const result = await window.pywebview.api.download(startDate, endDate);
        if (result === true) {
          if (startDate && endDate) {
            showMessage(`✅ Downloaded records from ${startDate} to ${endDate}`, "green");
          } else {
            showMessage("✅ Full Cashbook report downloaded!", "green");
          }
          return true;
        } else {
          showMessage("❌ Error downloading cashbook report", "red");
          return false;
        }
      } catch (e) {
        console.error("Download failed:", e);
        showMessage("❌ An error occurred", "red");
        return false;
      } finally {
        btn.textContent = originalText;
        btn.disabled = false;
      }
    }


 /* Table date filter (for date-modal1) */
  function openDateModal1() {
    document.getElementById("date-modal1").style.display = "flex";
  }

  function closeDateModal1() {
    document.getElementById("date-modal1").style.display = "none";
  }

  function applyDateFilter() {
    const start = document.getElementById("start-date1").value;
    const end = document.getElementById("end-date1").value;

    if (!start || !end) {
      showMessage("⚠️ Please select both dates!", "red");
      return;
    }

    const filtered = allCashbookData.filter(entry => {
      const dateStr = entry.Transaction_Date;
      let txDate;

      if (/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) {
        txDate = new Date(dateStr);
      } else if (/^\d{2}-\d{2}-\d{4}$/.test(dateStr)) {
        const parts = dateStr.split("-");
        txDate = new Date(parts[2], parts[1] - 1, parts[0]);
      } else {
        return false;
      }

      return txDate >= new Date(start) && txDate <= new Date(end);
    });

    renderCashbookTable(filtered);
    closeDateModal1();
  }

  function resetDateFilter() {
    document.getElementById("start-date1").value = "";
    document.getElementById("end-date1").value = "";
    renderCashbookTable(allCashbookData);
  }
