<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>📚 Student Entry Portal</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #2C3E50;
      --primary-light: #3498DB;
      --primary-dark: #1A252F;
      --accent: #3498DB;
      --success: #27AE60;
      --warning: #F39C12;
      --danger: #E74C3C;
      --bg-primary: #F8FAFC;
      --bg-secondary: #FFFFFF;
      --bg-card: rgba(255, 255, 255, 0.8);
      --text-primary: #1E293B;
      --text-secondary: #64748B;
      --border: rgba(44, 62, 80, 0.1);
      --shadow: 0 25px 50px -12px rgba(44, 62, 80, 0.15);
      --glow: 0 0 30px rgba(52, 152, 219, 0.2);
    }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, var(--bg-primary) 0%, #E8F4FD 100%);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 20% 80%, rgba(52, 152, 219, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(44, 62, 80, 0.05) 0%, transparent 50%),
        radial-gradient(circle at 40% 40%, rgba(52, 152, 219, 0.03) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(20px);
      background: rgba(255, 255, 255, 0.9);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
    }

    .header-content {
      max-width: 2200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      position: relative;
    }
    
    .back-btn {
      background: rgba(44, 62, 80, 0.08);
      border: 1px solid var(--border);
      color: var(--primary);
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      margin-right: 10px;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 18px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      backdrop-filter: blur(10px);
    }

    .back-btn:hover {
      background: rgba(44, 62, 80, 0.12);
      transform: translateX(-2px);
      box-shadow: var(--glow);
    }
    
    .header-title {
      font-size: 2.5rem;
      font-weight: 600;
      background: linear-gradient(135deg, var(--text-primary) 0%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    /* .header-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 16px;
    } */
    
    .main-content {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    
    .form-container {
      width: 100%;
      max-width: 1200px;
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 3rem;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }

    .form-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
    }
    
    .form-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    
    .form-title {
      font-size: 2rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 0.5rem;
    }
    
    .form-subtitle {
      color: var(--text-secondary);
      font-size: 1rem;
      font-weight: 500;
    }
    
    .status-message {
      margin-bottom: 2rem;
      padding: 1rem;
      border-radius: 12px;
      font-weight: 500;
      text-align: center;
      opacity: 0;
      transform: translateY(-10px);
      transition: all 0.3s ease;
      min-height: 20px;
    }

    .status-message.show {
      opacity: 1;
      transform: translateY(0);
    }

    .status-message.success {
      background: rgba(39, 174, 96, 0.1);
      border: 1px solid rgba(39, 174, 96, 0.3);
      color: #2ECC71;
    }

    .status-message.error {
      background: rgba(231, 76, 60, 0.1);
      border: 1px solid rgba(231, 76, 60, 0.3);
      color: #E74C3C;
    }

    .status-message.warning {
      background: rgba(243, 156, 18, 0.1);
      border: 1px solid rgba(243, 156, 18, 0.3);
      color: #F39C12;
    }
    
    .entry-mode-selector {
      background: rgba(248, 250, 252, 0.8);
      border-radius: 16px;
      padding: 8px;
      display: flex;
      gap: 8px;
      margin-bottom: 2rem;
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
    }
    
    .mode-option {
      flex: 1;
      padding: 12px 20px;
      border: none;
      border-radius: 12px;
      background: transparent;
      color: var(--text-secondary);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    
    .mode-option.active {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      color: white;
      box-shadow: 0 4px 12px rgba(44, 62, 80, 0.3);
      transform: translateY(-1px);
    }

    .mode-option:hover:not(.active) {
      background: rgba(44, 62, 80, 0.05);
      color: var(--text-primary);
    }
    
    .section-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .section-icon {
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--accent);
      border-radius: 6px;
      font-size: 12px;
      color: white;
    }
    
    .form-group-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1.5rem;
      margin-bottom: 1.5rem;
    }
    
    .form-group {
      margin-bottom: 1.5rem;
    }
    
    .form-group label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .label-icon {
      color: var(--accent);
      font-size: 12px;
    }
    
    .form-group input, 
    .form-group select {
      width: 100%;
      padding: 1rem 1.25rem;
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text-primary);
      font-size: 0.95rem;
      font-weight: 400;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      backdrop-filter: blur(10px);
    }
    
    .form-group input:focus, 
    .form-group select:focus {
      outline: none;
      border-color: var(--accent);
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 0 0 4px rgba(52, 152, 219, 0.1);
      transform: translateY(-1px);
    }
    
    .form-group input::placeholder {
      color: var(--text-secondary);
      font-weight: 400;
    }
    
    .file-upload-area {
      border: 2px dashed var(--border);
      border-radius: 16px;
      padding: 3rem 2rem;
      text-align: center;
      background: rgba(255, 255, 255, 0.5);
      transition: all 0.3s ease;
      cursor: pointer;
      backdrop-filter: blur(10px);
    }
    
    .file-upload-area:hover {
      border-color: var(--accent);
      background: rgba(255, 255, 255, 0.7);
      transform: translateY(-2px);
    }
    
    .file-upload-area.dragover {
      border-color: var(--accent);
      background: rgba(52, 152, 219, 0.05);
      box-shadow: var(--glow);
    }
    
    .upload-icon {
      font-size: 3rem;
      color: var(--text-secondary);
      margin-bottom: 1rem;
    }
    
    .upload-text {
      font-size: 1.125rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 0.5rem;
    }
    
    .upload-subtext {
      color: var(--text-secondary);
      font-size: 0.875rem;
    }
    
    .file-input {
      display: none;
    }

    .selected-file {
      margin-top: 1rem;
    }
    
    .button-group {
      display: flex;
      gap: 1rem;
      margin-top: 2rem;
    }
    
    .submit-btn {
      width: 100%;
      padding: 1.25rem 2rem;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      border: none;
      border-radius: 16px;
      color: #FFFFFF;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .submit-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
      transition: left 0.5s;
    }

    .submit-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 40px rgba(44, 62, 80, 0.3);
      background: linear-gradient(135deg, var(--primary-light) 0%, var(--accent) 100%);
    }

    .submit-btn:hover::before {
      left: 100%;
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    .submit-btn:disabled {
      background: rgba(44, 62, 80, 0.1);
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    
    .loader {
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top: 2px solid white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .floating-elements {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .floating-element {
      position: absolute;
      width: 4px;
      height: 4px;
      background: var(--accent);
      border-radius: 50%;
      opacity: 0.1;
      animation: float 20s infinite linear;
    }

    .floating-element:nth-child(1) { left: 10%; animation-delay: 0s; }
    .floating-element:nth-child(2) { left: 20%; animation-delay: 2s; }
    .floating-element:nth-child(3) { left: 30%; animation-delay: 4s; }
    .floating-element:nth-child(4) { left: 40%; animation-delay: 6s; }
    .floating-element:nth-child(5) { left: 50%; animation-delay: 8s; }
    .floating-element:nth-child(6) { left: 60%; animation-delay: 10s; }
    .floating-element:nth-child(7) { left: 70%; animation-delay: 12s; }
    .floating-element:nth-child(8) { left: 80%; animation-delay: 14s; }
    .floating-element:nth-child(9) { left: 90%; animation-delay: 16s; }

    @keyframes float {
      0% {
        transform: translateY(100vh) scale(0);
        opacity: 0;
      }
      10% {
        opacity: 0.1;
      }
      90% {
        opacity: 0.1;
      }
      100% {
        transform: translateY(-10vh) scale(1);
        opacity: 0;
      }
    }
    
    .hidden {
      display: none !important;
    }
    
    .fade-in {
      animation: fadeIn 0.5s ease-in-out;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    /* Responsive Design */
    @media (max-width: 768px) {
      .form-container {
        padding: 2rem;
        margin: 1rem;
      }
      
      .header {
        padding: 1rem;
      }
      
      .main-content {
        padding: 1rem;
      }
      
      .form-group-row {
        grid-template-columns: 1fr;
        gap: 1rem;
      }
      
      .entry-mode-selector {
        flex-direction: column;
      }
      
      .button-group {
        flex-direction: column;
      }
    }

    @media (max-width: 480px) {
      .form-container {
        padding: 1.5rem;
        border-radius: 16px;
      }
      
      .header-title {
        font-size: 1.25rem;
      }
      
      .section-title {
        font-size: 1rem;
      }
    }
    
    /* Modern scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }
    
    ::-webkit-scrollbar-track {
      background: rgba(248, 250, 252, 0.8);
      border-radius: 4px;
    }
    
    ::-webkit-scrollbar-thumb {
      background: var(--primary);
      border-radius: 4px;
    }
    
    ::-webkit-scrollbar-thumb:hover {
      background: var(--primary-light);
    }
  </style>
</head>
<body>
  <div class="floating-elements">
    <div class="floating-element"></div>
    <div class="floating-element"></div>
    <div class="floating-element"></div>
    <div class="floating-element"></div>
    <div class="floating-element"></div>
    <div class="floating-element"></div>
    <div class="floating-element"></div>
    <div class="floating-element"></div>
    <div class="floating-element"></div>
  </div>

  <div class="container">
    <header class="header">
      <div class="header-content">
        <button class="back-btn" onclick="goBack()" title="Go Back">
          <i class="fas fa-arrow-left"></i>
        </button>
        <div class="header-title">
          
          Student Registration Portal
        </div>
      </div>
    </header>

    <main class="main-content">
      <div class="form-container">
        <div class="form-header">
          <h1 class="form-title">Register New Student</h1>
          <p class="form-subtitle">Add student information to the system</p>
        </div>

        <div id="status-msg" class="status-message"></div>

        <div class="form-section">
          <div class="entry-mode-selector">
            <button class="mode-option active" onclick="setEntryMode('manual')">
              <i class="fas fa-keyboard"></i>
              Manual Entry
            </button>
            <button class="mode-option" onclick="setEntryMode('excel')">
              <i class="fas fa-file-excel"></i>
              Excel Upload
            </button>
          </div>

          <!-- Manual Input Form -->
          <div id="manualForm" class="fade-in">
            <div class="section-title">
              <span class="section-icon">
                <i class="fas fa-user"></i>
              </span>
              Student Information
            </div>
            
            <div class="form-group-row">
              <div class="form-group">
                <label for="student_id">
                  <i class="fas fa-id-card label-icon"></i>
                  Student ID
                </label>
                <input type="text" id="student_id" placeholder="Enter student ID" />
              </div>
              <div class="form-group">
                <label for="student_name">
                  <i class="fas fa-user label-icon"></i>
                  Full Name
                </label>
                <input type="text" id="student_name" placeholder="Enter full name" />
              </div>
            </div>

            <div class="form-group-row">
              <div class="form-group">
                <label for="dob">
                  <i class="fas fa-calendar label-icon"></i>
                  Date of Birth
                </label>
                <input type="date" id="dob" />
              </div>
              <div class="form-group">
                <label for="department">
                  <i class="fas fa-building label-icon"></i>
                  Department
                </label>
                <input type="text" id="department" placeholder="Enter department" />
              </div>
            </div>

            <div class="form-group-row">
              <div class="form-group">
                <label for="email">
                  <i class="fas fa-envelope label-icon"></i>
                  Email Address
                </label>
                <input type="email" id="email" placeholder="Enter email address" />
              </div>
              <div class="form-group">
                <label for="phone">
                  <i class="fas fa-phone label-icon"></i>
                  Phone Number
                </label>
                <input type="tel" id="phone" placeholder="Enter phone number" />
              </div>
            </div>

            <div class="form-group-row">
              <div class="form-group">
                <label for="address">
                  <i class="fas fa-map-marker-alt label-icon"></i>
                  Address
                </label>
                <input type="text" id="address" placeholder="Enter address" />
              </div>
              <div class="form-group">
                <label for="admission_year">
                  <i class="fas fa-calendar-alt label-icon"></i>
                  Admission Year
                </label>
                <input type="number" id="admission_year" placeholder="e.g., 2024" min="1900" max="2030" />
              </div>
            </div>
          </div>

          <!-- Excel Upload Form -->
          <div id="excelForm" class="hidden">
            <div class="section-title">
              <span class="section-icon">
                <i class="fas fa-file-upload"></i>
              </span>
              Upload Excel File
            </div>
            
            <div class="file-upload-area" onclick="document.getElementById('fileInput').click()">
              <div class="upload-icon">
                <i class="fas fa-cloud-upload-alt"></i>
              </div>
              <div class="upload-text">Choose Excel File</div>
              <div class="upload-subtext">or drag and drop your .xlsx or .xls file here</div>
              <input 
                type="file" 
                id="fileInput" 
                class="file-input" 
                accept=".xlsx,.xls" 
                onchange="handleFileSelect(this)"
              />
            </div>
            <div id="selectedFileName" class="selected-file"></div>
          </div>

          <div class="button-group">
            <button class="submit-btn" id="submitbtn" onclick="submitForm()">
              <i class="fas fa-paper-plane"></i>
              Submit Registration
            </button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    let currentMode = 'manual';

    function setEntryMode(mode) {
      currentMode = mode;
      
      // Update mode selector buttons
      document.querySelectorAll('.mode-option').forEach(btn => {
        btn.classList.remove('active');
      });
      event.target.classList.add('active');
      
      // Show/hide forms
      document.getElementById('manualForm').classList.toggle('hidden', mode === 'excel');
      document.getElementById('excelForm').classList.toggle('hidden', mode === 'manual');
    }

    function showMessage(message, type = "success") {
      const msgBox = document.getElementById("status-msg");
      msgBox.textContent = message;
      msgBox.className = `status-message show ${type}`;
      
      setTimeout(() => {
        msgBox.classList.remove("show");
      }, 5000);
    }

    function handleFileSelect(input) {
      const fileName = input.files[0]?.name;
      const fileNameDiv = document.getElementById('selectedFileName');
      
      if (fileName) {
        fileNameDiv.innerHTML = `
          <div style="margin-top: 16px; padding: 12px; background: rgba(52, 152, 219, 0.1); border: 1px solid rgba(52, 152, 219, 0.3); border-radius: 8px; color: #3498DB; font-weight: 600;">
            <i class="fas fa-file-excel" style="margin-right: 8px;"></i>
            ${fileName}
          </div>
        `;
      }
    }

    async function submitForm() {
      const submitBtn = document.getElementById("submitbtn");
      const originalHTML = submitBtn.innerHTML;

      submitBtn.disabled = true;
      submitBtn.innerHTML = `<div class="loader"></div> Processing...`;

      try {
        if (currentMode === "manual") {
          await submitStudentInfo();
        } else {
          await uploadStudentData();
        }
      } catch (e) {
        console.error(e);
        showMessage("Something went wrong. Please try again.", "error");
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = originalHTML;
      }
    }

    async function submitStudentInfo() {
      const data = {
        student_id: document.getElementById("student_id").value.trim(),
        student_name: document.getElementById("student_name").value.trim(),
        dob: document.getElementById("dob").value.trim(),
        department: document.getElementById("department").value.trim(),
        email: document.getElementById("email").value.trim(),
        phone: document.getElementById("phone").value.trim(),
        address: document.getElementById("address").value.trim(),
        admission_year: document.getElementById("admission_year").value.trim()
      };

      // Validation
      if (Object.values(data).some(val => val === "")) {
        showMessage("Please fill in all required fields.", "warning");
        return;
      }

      // Simulate API call (replace with actual API call)
      try {
        const res = await window.pywebview.api.submit_Student_Info(data);
        
        if (res.phone === false) {
          showMessage("Invalid phone number format!", "error");
          return;
        }
        
        if (res.admission_year === false) {
          showMessage("Invalid admission year!", "error");
          return;
        }
        
        if (res.email === false) {
          showMessage("Invalid email format!", "error");
          return;
        }

        if (res && res.includes("successfully")) {
          showMessage("Student registered successfully!", "success");
          clearFields();
        } else {
          showMessage("Registration failed: " + res, "error");
        }
      } catch (error) {
        showMessage("Network error. Please check your connection.", "error");
      }
    }

    async function uploadStudentData() {
      const fileInput = document.getElementById("fileInput");
      
      if (!fileInput.files.length) {
        showMessage("Please select an Excel file to upload.", "warning");
        return;
      }

      const fileName = fileInput.files[0].name;
      
      try {
        const res = await window.pywebview.api.uploadStudentData(fileName);
        showMessage(res, "success");
        clearFields();
      } catch (error) {
        showMessage("Upload failed. Please try again.", "error");
      }
    }

    function clearFields() {
      // Clear manual form fields
      ["student_id", "student_name", "dob", "department", "email", "phone", "address", "admission_year"]
        .forEach(id => {
          const element = document.getElementById(id);
          if (element) element.value = "";
        });
      
      // Clear file input
      const fileInput = document.getElementById("fileInput");
      if (fileInput) fileInput.value = "";
      
      const fileNameDiv = document.getElementById('selectedFileName');
      if (fileNameDiv) fileNameDiv.innerHTML = "";
    }

    function goBack() {
      if (window.pywebview?.api?.go_back) {
        window.pywebview.api.go_back();
      } else if (window.history.length > 1) {
        window.history.back();
      } else {
        showMessage("Unable to navigate back.", "error");
      }
    }

    // Drag and drop functionality
    const uploadArea = document.querySelector('.file-upload-area');
    
    uploadArea.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadArea.classList.add('dragover');
    });
    
    uploadArea.addEventListener('dragleave', () => {
      uploadArea.classList.remove('dragover');
    });
    
    uploadArea.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadArea.classList.remove('dragover');
      
      const files = e.dataTransfer.files;
      if (files.length > 0 && (files[0].name.endsWith('.xlsx') || files[0].name.endsWith('.xls'))) {
        document.getElementById('fileInput').files = files;
        handleFileSelect(document.getElementById('fileInput'));
      }
    });
  </script>
</body>
</html>
