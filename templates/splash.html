<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Library Management - Loading</title>
    <style>
        body {
            /* background: #ffffff; */
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
        }
        
        .logo-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        img {
            width: 150px;
            height: auto;
            /* background-color: #ffffff; */
            border-radius: 20%;
            position: relative;
            z-index: 2;
            animation: logoFloat 3s infinite ease-in-out, logoGlow 2s infinite alternate;
            filter: drop-shadow(0 0 20px rgba(52, 152, 219, 0.6));
        }
        
        /* Rotating glow ring */
        .glow-ring {
            position: absolute;
            width: 180px;
            height: 180px;
            border: 3px solid transparent;
            border-top: 3px solid #3498db;
            border-right: 3px solid #e74c3c;
            border-radius: 50%;
            animation: rotate 2s linear infinite;
            z-index: 1;
        }
        
        /* Pulsing outer glow */
        .outer-glow {
            position: absolute;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(52, 152, 219, 0.3) 0%, rgba(52, 152, 219, 0.1) 50%, transparent 70%);
            animation: pulseGlow 1.5s infinite ease-in-out;
            z-index: 0;
        }
        
        /* Sparkle effects */
        .sparkle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #ffffff;
            border-radius: 50%;
            animation: sparkle 2s infinite ease-in-out;
        }
        
        .sparkle:nth-child(1) {
            top: 20px;
            left: 30px;
            animation-delay: 0s;
        }
        
        .sparkle:nth-child(2) {
            top: 40px;
            right: 25px;
            animation-delay: 0.5s;
        }
        
        .sparkle:nth-child(3) {
            bottom: 30px;
            left: 40px;
            animation-delay: 1s;
        }
        
        .sparkle:nth-child(4) {
            bottom: 50px;
            right: 35px;
            animation-delay: 1.5s;
        }
        
        h1 {
            margin-top: 40px;
            font-size: 1.8rem;
            letter-spacing: 1px;
            opacity: 0.9;
            animation: textGlow 2s infinite alternate;
        }
        
        /* Loading dots */
        .loading-dots {
            margin-top: 20px;
            display: flex;
            gap: 8px;
        }
        
        .dot {
            width: 8px;
            height: 8px;
            background: #3498db;
            border-radius: 50%;
            animation: dotBounce 1.4s infinite ease-in-out both;
        }
        
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        .dot:nth-child(3) { animation-delay: 0s; }
        
        @keyframes logoFloat {
            0%, 100% { 
                transform: translateY(0px) scale(1);
            }
            50% { 
                transform: translateY(-10px) scale(1.05);
            }
        }
        
        @keyframes logoGlow {
            0% {
                filter: drop-shadow(0 0 20px rgba(52, 152, 219, 0.6)) 
                        drop-shadow(0 0 40px rgba(52, 152, 219, 0.4));
            }
            100% {
                filter: drop-shadow(0 0 30px rgba(52, 152, 219, 0.8)) 
                        drop-shadow(0 0 60px rgba(52, 152, 219, 0.6))
                        drop-shadow(0 0 80px rgba(52, 152, 219, 0.3));
            }
        }
        
        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @keyframes pulseGlow {
            0%, 100% { 
                transform: scale(0.8);
                opacity: 0.5;
            }
            50% { 
                transform: scale(1.2);
                opacity: 0.8;
            }
        }
        
        @keyframes sparkle {
            0%, 100% { 
                opacity: 0;
                transform: scale(0);
            }
            50% { 
                opacity: 1;
                transform: scale(1);
            }
        }
        
        @keyframes textGlow {
            0% {
                text-shadow: 0 0 10px rgba(52, 152, 219, 0.5);
            }
            100% {
                text-shadow: 0 0 20px rgba(52, 152, 219, 0.8),
                            0 0 30px rgba(52, 152, 219, 0.6);
            }
        }
        
        @keyframes dotBounce {
            0%, 80%, 100% { 
                transform: scale(0.8);
                opacity: 0.5;
            } 
            40% { 
                transform: scale(1.2);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="logo-container">
        <div class="outer-glow"></div>
        <div class="glow-ring"></div>
        <img src="logo1.png" alt="Logo" />
        <div class="sparkle"></div>
        <div class="sparkle"></div>
        <div class="sparkle"></div>
        <div class="sparkle"></div>
    </div>

        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
    </div> -->
</body>
</html>
